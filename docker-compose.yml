version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart_hostel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_hostel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_hostel_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/smart_hostel
      JWT_SECRET_KEY: smart-hostel-aiot-jwt-super-secret-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_hostel_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
